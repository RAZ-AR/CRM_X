# Синхронизация Helix → CRM X и Quicky раз в 6 часов (Vercel Hobby разрешает cron только раз в сутки).
# Сразу — кнопка «Синхронизировать» в CRM X или Quicky (/api/helix/sync).
# Секреты репозитория: QUICKY_URL (https://crm-x-nine.vercel.app), CRON_SECRET (тот же, что в Vercel).
name: Helix sync
on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Только посчитать, ничего не записывать"
        type: boolean
        default: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/helix
        env:
          QUICKY_URL: ${{ secrets.QUICKY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY: ${{ inputs.dry && '1' || '0' }}
        # Helix иногда подвисает — одна повторная попытка через 30 с. На 401 (неверный секрет) не повторяем.
        run: |
          call() {
            code=$(curl -sS -o out.json -w "%{http_code}" --max-time 90 \
              -H "Authorization: Bearer $CRON_SECRET" "$QUICKY_URL/api/cron/helix?dry=$DRY") || code=000
            cat out.json 2>/dev/null || true; echo; echo "HTTP $code"
          }
          call
          if [ "$code" != "200" ] && [ "$code" != "401" ]; then
            echo "::warning::Первая попытка: HTTP $code, повтор через 30 с"
            sleep 30; call
          fi
          test "$code" = "200"
